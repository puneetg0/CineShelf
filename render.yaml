databases:
  - name: cineshelf-db
    plan: free
    databaseName: cineshelf
    user: cineshelf

services:
  # ── Backend (FastAPI / uvicorn) ──────────────────────────────────────────────
  - type: web
    name: cineshelf-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cineshelf-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false   # fill in manually after the frontend URL is known

  # ── Frontend (Vite static site) ──────────────────────────────────────────────
  - type: web
    name: cineshelf-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    plan: free
    envVars:
      - key: VITE_API_URL
        sync: false   # fill in manually after the backend URL is known
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
